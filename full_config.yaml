## hw and sw setup

wifi:
  fast_connect: true           # Needed if powered from the CS60

logger:
  baud_rate: 115200 #0
  hardware_uart: UART1
  level: WARN
  # level: DEBUG
  # level: VERY_VERBOSE

external_components:
  - source: github://jorgen-benum/esphome-flexit-modbus-server@main
    refresh: 60s
    components: 
      - flexit_modbus_server

# setup for XIAO ESP32C6 https://wiki.seeedstudio.com/xiao_esp32c6_getting_started/
uart:
  id: modbus_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  baud_rate: 115200

  # debug:
    # direction: BOTH
    # direction: BOTH
    # dummy_receiver: false

flexit_modbus_server:
  - id: server
    uart_id: modbus_uart
    address: 1 # must be 1 if using cl60 panel
    tx_enable_pin: GPIO4
    tx_enable_direct: true

    tcp_bridge_enabled: true
    tcp_bridge_port: 8502
    tcp_bridge_max_clients: 3

# esp home controls and sensors

globals:
  - id: default_supply_fan_min
    type: float
    restore_value: no
    initial_value: '50.0'  # Commissioned MIN supply

  - id: default_extract_fan_min
    type: float
    restore_value: no
    initial_value: '50.0'  # Commissioned MIN extract

  - id: default_supply_fan_normal
    type: float
    restore_value: no
    initial_value: '60.0'  # Commissioned NORMAL supply

  - id: default_extract_fan_normal
    type: float
    restore_value: no
    initial_value: '57.0'  # Commissioned NORMAL extract

  - id: default_supply_fan_max
    type: float
    restore_value: no
    initial_value: '100.0'  # Commissioned MAX supply

  - id: default_extract_fan_max
    type: float
    restore_value: no
    initial_value: '100.0'  # Commissioned MAX extract

  - id: temporary_profile_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: temporary_profile_owner
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: temporary_profile_target_mode
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: temporary_profile_supply
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: temporary_profile_extract
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: temporary_profile_restore_supply
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: temporary_profile_restore_extract
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: temporary_profile_lease_seconds
    type: int
    restore_value: no
    initial_value: '0'

  - id: temporary_profile_lease_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: temporary_profile_change_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: temporary_profile_apply_pending
    type: bool
    restore_value: no
    initial_value: 'false'

api:
  actions:
    # One logical request: profile + target mode + owner + safety lease.
    # Sending an identical request only renews the lease; no Modbus values or
    # mode are re-applied.
    - action: apply_temporary_profile
      variables:
        owner: string
        target_mode: string
        supply: float
        extract: float
        lease_seconds: int
      then:
        - lambda: |-
            id(temporary_profile_apply_pending) = false;
            if (owner.empty() || lease_seconds <= 0) {
              ESP_LOGW("temp_profile", "Rejected request with empty owner or invalid lease");
              return;
            }

            if (target_mode == "Stop") {
              ESP_LOGW("temp_profile", "Stop is not a valid temporary-profile target");
              return;
            }

            const int current_mode = id(server)->read_holding_register(
              flexit_modbus_server::REG_MODE
            );
            if (current_mode == 0) {
              ESP_LOGW("temp_profile", "Rejected temporary profile while Flexit is stopped");
              return;
            }

            const bool same_request =
              id(temporary_profile_active) &&
              id(temporary_profile_owner) == owner &&
              id(temporary_profile_target_mode) == target_mode &&
              fabsf(id(temporary_profile_supply) - supply) < 0.01f &&
              fabsf(id(temporary_profile_extract) - extract) < 0.01f;

            id(temporary_profile_lease_seconds) = lease_seconds;
            id(temporary_profile_lease_started_ms) = millis();

            if (same_request) {
              ESP_LOGD("temp_profile", "Renewing lease for owner '%s'", owner.c_str());
              id(temporary_profile_lease_timer).execute();
              return;
            }

            // First owner snapshots the profile being overridden. A replacement
            // owner keeps that original snapshot, so humidity -> fireplace does
            // not turn the humidity profile into the restore point.
            if (!id(temporary_profile_active)) {
              if (target_mode == "Min") {
                id(temporary_profile_restore_supply) = id(supply_air_percentage_min).state;
                id(temporary_profile_restore_extract) = id(extract_air_percentage_min).state;
              } else if (target_mode == "Normal") {
                id(temporary_profile_restore_supply) = id(supply_air_percentage_normal).state;
                id(temporary_profile_restore_extract) = id(extract_air_percentage_normal).state;
              } else if (target_mode == "Max") {
                id(temporary_profile_restore_supply) = id(supply_air_percentage_max).state;
                id(temporary_profile_restore_extract) = id(extract_air_percentage_max).state;
              } else {
                ESP_LOGW("temp_profile", "Unsupported target mode '%s'", target_mode.c_str());
                return;
              }
            } else if (id(temporary_profile_target_mode) != target_mode) {
              // Generic executor supports a different target later, but do not
              // silently mix restore snapshots between profile slots.
              ESP_LOGW("temp_profile", "Cannot change target mode while a temporary profile is active");
              return;
            }

            id(temporary_profile_apply_pending) = true;
            id(temporary_profile_active) = true;
            id(temporary_profile_owner) = owner;
            id(temporary_profile_target_mode) = target_mode;
            id(temporary_profile_supply) = supply;
            id(temporary_profile_extract) = extract;
            id(temporary_profile_change_ms) = millis();

            ESP_LOGI("temp_profile", "Applying owner='%s' mode=%s supply=%.0f extract=%.0f lease=%ds",
                     owner.c_str(), target_mode.c_str(), supply, extract, lease_seconds);

            if (target_mode == "Min") {
              auto supply_call = id(supply_air_percentage_min).make_call();
              supply_call.set_value(supply);
              supply_call.perform();
              auto extract_call = id(extract_air_percentage_min).make_call();
              extract_call.set_value(extract);
              extract_call.perform();
            } else if (target_mode == "Normal") {
              auto supply_call = id(supply_air_percentage_normal).make_call();
              supply_call.set_value(supply);
              supply_call.perform();
              auto extract_call = id(extract_air_percentage_normal).make_call();
              extract_call.set_value(extract);
              extract_call.perform();
            } else {
              auto supply_call = id(supply_air_percentage_max).make_call();
              supply_call.set_value(supply);
              supply_call.perform();
              auto extract_call = id(extract_air_percentage_max).make_call();
              extract_call.set_value(extract);
              extract_call.perform();
            }
        - delay: 200ms
        - lambda: |-
            // Renewal/rejected requests do not reassert the Flexit mode.
            if (!id(temporary_profile_apply_pending) ||
                !id(temporary_profile_active) ||
                id(temporary_profile_owner) != owner) {
              return;
            }
            id(temporary_profile_apply_pending) = false;
            id(temporary_profile_change_ms) = millis();
            auto call = id(set_mode).make_call();
            call.set_option(target_mode);
            call.perform();
            id(temporary_profile_lease_timer).execute();
            id(temporary_profile_owner_sensor).update();
            id(temporary_profile_lease_remaining).update();

    # Explicit release is owner-checked so a stale fireplace OFF cannot cancel
    # a newer humidity request (or vice versa).
    - action: release_temporary_profile
      variables:
        owner: string
      then:
        - if:
            condition:
              lambda: |-
                return id(temporary_profile_active) &&
                       id(temporary_profile_owner) == owner;
            then:
              - script.execute: temporary_profile_finish

switch:
  - platform: template
    id: heater
    name: "Heater"
    lambda: "return id(server)->read_holding_register(flexit_modbus_server::REG_STATUS_HEATER);"
    turn_on_action:
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_HEATER,
            1
          );
    turn_off_action:
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_HEATER,
            0
          );

  - platform: template
    id: supply_air_control
    name: "Supply Air Control"
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL,
            1
          );
    turn_off_action:
      - lambda: |-
          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_TEMPERATURE_SUPPLY_AIR_CONTROL,
            0
          );

