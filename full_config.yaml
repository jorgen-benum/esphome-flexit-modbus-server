sensor:
  - platform: template
    id: temporary_profile_lease_remaining
    name: "Temporary Profile Lease Remaining"
    icon: mdi:timer-outline
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!id(temporary_profile_active) || id(temporary_profile_lease_seconds) <= 0) {
        return 0.0f;
      }
      const uint32_t elapsed = (millis() - id(temporary_profile_lease_started_ms)) / 1000U;
      const int remaining = id(temporary_profile_lease_seconds) - static_cast<int>(elapsed);
      return static_cast<float>(remaining > 0 ? remaining : 0);

