select:
  - platform: template
    id: set_mode
    name: "Set Mode"
    update_interval: 1s
    lambda: |-
      return flexit_modbus_server::mode_to_string(
        id(server)->read_holding_register(flexit_modbus_server::REG_MODE)
      );
    options:
      - Stop
      - Min
      - Normal
      - Max
    set_action:
      lambda: |-
        id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_MODE,
            flexit_modbus_server::string_to_mode(x)
        );

sensor:
  - platform: template
    id: temporary_profile_lease_remaining
    name: "Temporary Profile Lease Remaining"
    icon: mdi:timer-outline
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!id(temporary_profile_active) || id(temporary_profile_lease_seconds) <= 0) {
        return 0.0f;
      }
      const uint32_t elapsed = (millis() - id(temporary_profile_lease_started_ms)) / 1000U;
      const int remaining = id(temporary_profile_lease_seconds) - static_cast<int>(elapsed);
      return static_cast<float>(remaining > 0 ? remaining : 0);

  - platform: template
    id: setpoint_air_temperature
    name: "Setpoint Air Temperature"
    update_interval: 1s
    device_class: temperature
    unit_of_measurement: "°C"
    lambda: |-
      return id(server)->read_holding_register_temperature(
        flexit_modbus_server::REG_TEMPERATURE_SETPOINT
      );

  - platform: template
    id: supply_air_temperature
    name: "Supply Air Temperature"
    update_interval: 60s
    device_class: temperature
    unit_of_measurement: "°C"
    lambda: |-
      return id(server)->read_holding_register_temperature(
        flexit_modbus_server::REG_TEMPERATURE_SUPPLY_AIR
      );
    filters:
      - delta: 0.2

  - platform: template
    id: extract_air_temperature
    name: "Extract Air Temperature"
    update_interval: 60s
    device_class: temperature
    unit_of_measurement: "°C"
    lambda: |-
      return id(server)->read_holding_register_temperature(
        flexit_modbus_server::REG_TEMPERATURE_EXTRACT_AIR
