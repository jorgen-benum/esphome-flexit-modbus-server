esphome:
  name: flexit
  friendly_name: Flexit

esp32:
  board: esp32-c3-m1i-kit
  framework:
    type: arduino

#### Insert your setup from here ####

ota:
  - platform: esphome
    password: !secret flexit_ota_password

wifi:
  fast_connect: true           # Needed if powered from the CS60
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot in case the Wi-Fi connection fails
  ap:
    ssid: "Flexit Fallback Hotspot"
    password: !secret fallback_ap_password

#### ----------To here---------- ####

substitutions:
  # Commissioned profile values; these initialize ESPHome state only and do not write Modbus at boot.
  commissioned_supply_fan_min: "50.0"
  commissioned_extract_fan_min: "50.0"
  commissioned_supply_fan_normal: "60.0"
  commissioned_extract_fan_normal: "57.0"
  commissioned_supply_fan_max: "100.0"
  commissioned_extract_fan_max: "100.0"

  # Temporary ownership is bounded to 12 hours, including timer conversion.
  MAX_SAFE_LEASE_SECONDS: "43200"

  # Allow Modbus writes to settle before the next transaction step.
  temporary_profile_modbus_settle_delay: "200ms"

  # Maximum wait for the commanded mode to appear before classifying takeover.
  temporary_profile_mode_ack_timeout_ms: "5000"

## hw and sw setup

logger:
  baud_rate: 115200 #0
  hardware_uart: UART1
  level: WARN
  # level: DEBUG
  # level: VERY_VERBOSE

external_components:
  - source: github://jorgen-benum/esphome-flexit-modbus-server@main
    refresh: 60s
    components:
      - flexit_modbus_server

uart:
  id: modbus_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  baud_rate: 115200

  # debug:
    # direction: BOTH
    # direction: BOTH
    # dummy_receiver: false

flexit_modbus_server:
  - id: server
    uart_id: modbus_uart
    address: 1 # must be 1 when using cl60 panel
    tx_enable_pin: GPIO4
    tx_enable_direct: true

    tcp_bridge_enabled: true
    tcp_bridge_port: 8502
    tcp_bridge_max_clients: 3

# esp home controls and sensors

globals:
  - id: temporary_profile_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: temporary_profile_owner
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: temporary_profile_target_mode
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: temporary_profile_supply
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: temporary_profile_extract
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: temporary_profile_restore_supply
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: temporary_profile_restore_extract
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: temporary_profile_lease_seconds
    type: int
    restore_value: no
    initial_value: '0'

  - id: temporary_profile_lease_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: temporary_profile_change_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: temporary_profile_apply_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: temporary_profile_phase
    # Executor lifecycle: 0=idle, 1=pending apply, 2=active, 3=finishing.
    type: int
    restore_value: no
    initial_value: '0'

  - id: temporary_profile_generation
    # Every accepted lifecycle transition advances this generation. Delayed
    # continuations act only when their transaction still owns the generation.
    type: int
    restore_value: no
    initial_value: '0'

  - id: temporary_profile_pending_generation
    type: int
    restore_value: no
    initial_value: '0'

  - id: temporary_profile_target_observed
    # False until command acknowledgement. Afterwards mismatch is immediate.
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: temporary_profile_pre_apply_mode
    # Physical running mode captured before temporary profile writes begin.
    type: int
    restore_value: no
    initial_value: '0'

api:
  encryption:
    key: !secret flexit_api_encryption_key
  actions:
    # One logical request: profile + target mode + owner + safety lease.
    # Sending an identical request only renews the lease; no Modbus values or
    # mode are re-applied.
    - action: apply_temporary_profile
      variables:
        owner: string
        target_mode: string
        supply: float
        extract: float
        lease_seconds: int
      then:
        - script.execute:
            id: temporary_profile_apply
            owner: !lambda "return owner;"
            target_mode: !lambda "return target_mode;"
            supply: !lambda "return supply;"
            extract: !lambda "return extract;"
            lease_seconds: !lambda "return lease_seconds;"

    # Explicit release is owner-checked so a stale fireplace OFF cannot cancel
    # a newer humidity request (or vice versa).
    - action: release_temporary_profile
      variables:
        owner: string
      then:
        - lambda: |-
            if (!id(temporary_profile_active) ||
                id(temporary_profile_owner) != owner ||
                id(temporary_profile_phase) == 0 ||
                id(temporary_profile_phase) == 3) {
              return;
            }
            const int transaction =
              id(temporary_profile_generation) >= std::numeric_limits<int>::max()
                ? 1 : id(temporary_profile_generation) + 1;
            id(temporary_profile_generation) = transaction;
            id(temporary_profile_phase) = 3;
            id(temporary_profile_apply_pending) = false;
            id(temporary_profile_apply).stop();
            id(temporary_profile_lease_timer).stop();
            id(temporary_profile_finish).execute(transaction);

