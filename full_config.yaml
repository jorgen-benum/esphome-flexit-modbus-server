    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      if (!id(temporary_profile_active) || id(temporary_profile_owner).empty()) {
        return std::string("none");
      }
      return id(temporary_profile_owner);

  - platform: template
    id: current_mode
    name: "Current Mode"
    update_interval: 1s
    lambda: |-
      return flexit_modbus_server::mode_to_string(
        id(server)->read_holding_register(
          flexit_modbus_server::REG_MODE
        )
      );

script:
  # API apply calls are serialized here. mode: single rejects a duplicate while
  # its settle-delay continuation is pending instead of letting two requests share
  # mutable pending state.
  - id: temporary_profile_apply
    mode: single
    parameters:
      owner: string
      target_mode: string
      supply: float
      extract: float
      lease_seconds: int
    then:
      - lambda: |-
          // Complete every validation before changing lease or diagnostic state.
          if (owner.empty() || lease_seconds <= 0 || lease_seconds > ${MAX_SAFE_LEASE_SECONDS}) {
            ESP_LOGW("temp_profile", "Rejected request with empty owner or out-of-range lease");
            return;
          }
          if (target_mode == "Stop") {
            ESP_LOGW("temp_profile", "Stop is not a valid temporary-profile target");
            return;
          }
          if (target_mode != "Min" && target_mode != "Normal" && target_mode != "Max") {
            ESP_LOGW("temp_profile", "Unsupported target mode '%s'", target_mode.c_str());
            return;
          }
          if (id(temporary_profile_phase) == 3) {
            ESP_LOGW("temp_profile", "Rejected apply while temporary-profile cleanup is finishing");
            return;
          }

          const int current_mode = id(server)->read_holding_register(
            flexit_modbus_server::REG_MODE
          );
          if (current_mode == 0) {
            ESP_LOGW("temp_profile", "Rejected temporary profile while Flexit is stopped");
            return;
          }

          const bool same_request =
            id(temporary_profile_active) &&
            id(temporary_profile_phase) == 2 &&
            id(temporary_profile_owner) == owner &&
            id(temporary_profile_target_mode) == target_mode &&
            fabsf(id(temporary_profile_supply) - supply) < 0.01f &&
            fabsf(id(temporary_profile_extract) - extract) < 0.01f;

          if (id(temporary_profile_active) &&
              id(temporary_profile_target_mode) != target_mode) {
            ESP_LOGW("temp_profile", "Cannot change target mode while a temporary profile is active");
            return;
          }

          if (same_request) {
            const int transaction =
              id(temporary_profile_generation) >= std::numeric_limits<int>::max()
                ? 1 : id(temporary_profile_generation) + 1;
            id(temporary_profile_generation) = transaction;
            id(temporary_profile_lease_seconds) = lease_seconds;
            id(temporary_profile_lease_started_ms) = millis();
            ESP_LOGD("temp_profile", "Renewing lease for owner '%s'", owner.c_str());
            id(temporary_profile_lease_timer).execute(
              transaction,
              lease_seconds
            );
            id(temporary_profile_lease_remaining).update();
            return;
          }

          if (id(temporary_profile_phase) != 0 && id(temporary_profile_phase) != 2) {
            ESP_LOGW("temp_profile", "Rejected apply while another transition is pending");
            return;
          }

          // The first owner snapshots the profile being overridden. A replacement
          // owner on the same target retains this original snapshot.
          if (!id(temporary_profile_active)) {
            if (target_mode == "Min") {
              id(temporary_profile_restore_supply) = id(supply_air_percentage_min).state;
              id(temporary_profile_restore_extract) = id(extract_air_percentage_min).state;
            } else if (target_mode == "Normal") {
              id(temporary_profile_restore_supply) = id(supply_air_percentage_normal).state;
              id(temporary_profile_restore_extract) = id(extract_air_percentage_normal).state;
            } else {
              id(temporary_profile_restore_supply) = id(supply_air_percentage_max).state;
              id(temporary_profile_restore_extract) = id(extract_air_percentage_max).state;
            }
          }

          const int transaction =
            id(temporary_profile_generation) >= std::numeric_limits<int>::max()
              ? 1 : id(temporary_profile_generation) + 1;
          id(temporary_profile_generation) = transaction;
          id(temporary_profile_pre_apply_mode) = current_mode;
          id(temporary_profile_pending_generation) = transaction;
          id(temporary_profile_phase) = 1;
          id(temporary_profile_apply_pending) = true;
          id(temporary_profile_active) = true;
          id(temporary_profile_owner) = owner;
          id(temporary_profile_target_mode) = target_mode;
          id(temporary_profile_supply) = supply;
          id(temporary_profile_extract) = extract;
          id(temporary_profile_lease_seconds) = lease_seconds;
          id(temporary_profile_lease_started_ms) = millis();
          id(temporary_profile_target_observed) = false;

          ESP_LOGI("temp_profile", "Applying owner='%s' mode=%s supply=%.0f extract=%.0f lease=%ds",
                   owner.c_str(), target_mode.c_str(), supply, extract, lease_seconds);

          if (target_mode == "Min") {
            auto supply_call = id(supply_air_percentage_min).make_call();
            supply_call.set_value(supply);
            supply_call.perform();
            auto extract_call = id(extract_air_percentage_min).make_call();
            extract_call.set_value(extract);
            extract_call.perform();
          } else if (target_mode == "Normal") {
            auto supply_call = id(supply_air_percentage_normal).make_call();
            supply_call.set_value(supply);
            supply_call.perform();
            auto extract_call = id(extract_air_percentage_normal).make_call();
            extract_call.set_value(extract);
            extract_call.perform();
          } else {
            auto supply_call = id(supply_air_percentage_max).make_call();
            supply_call.set_value(supply);
            supply_call.perform();
            auto extract_call = id(extract_air_percentage_max).make_call();
            extract_call.set_value(extract);
            extract_call.perform();
          }
      # Rejected requests and renewals leave apply_pending false, so they finish
      # synchronously and do not occupy mode: single during the configured settle delay.
      - if:
          condition:
            lambda: |-
              return id(temporary_profile_apply_pending) &&
                     id(temporary_profile_active) &&
                     id(temporary_profile_phase) == 1 &&
                     id(temporary_profile_pending_generation) == id(temporary_profile_generation) &&
                     id(temporary_profile_owner) == owner &&
                     id(temporary_profile_target_mode) == target_mode;
          then:
            - delay: ${temporary_profile_modbus_settle_delay}
            - lambda: |-
                // Revalidate the transaction after yielding to the delay.
                if (!id(temporary_profile_apply_pending) ||
                    !id(temporary_profile_active) ||
                    id(temporary_profile_phase) != 1 ||
                    id(temporary_profile_pending_generation) != id(temporary_profile_generation) ||
                    id(temporary_profile_owner) != owner ||
                    id(temporary_profile_target_mode) != target_mode) {
                  return;
                }

                // Stop is re-read immediately before the delayed target-mode command.
                const int current_mode = id(server)->read_holding_register(
                  flexit_modbus_server::REG_MODE
                );
                if (current_mode == 0) {
                  const int transaction =
                    id(temporary_profile_generation) >= std::numeric_limits<int>::max()
                      ? 1 : id(temporary_profile_generation) + 1;
                  id(temporary_profile_generation) = transaction;
                  id(temporary_profile_phase) = 3;
                  id(temporary_profile_apply_pending) = false;
                  id(temporary_profile_lease_timer).stop();
                  ESP_LOGI("temp_profile", "Stop selected during apply; restoring snapshot without changing mode");
                  id(temporary_profile_restore_snapshot).execute(transaction);
                  id(temporary_profile_clear_owner).execute(transaction);
                  return;
                }

                const int actual = current_mode;
                const int expected_target = flexit_modbus_server::string_to_mode(target_mode);
                if (actual != id(temporary_profile_pre_apply_mode) &&
                    actual != expected_target) {
                  const int transaction =
                    id(temporary_profile_generation) >= std::numeric_limits<int>::max()
                      ? 1 : id(temporary_profile_generation) + 1;
                  id(temporary_profile_generation) = transaction;
                  id(temporary_profile_phase) = 3;
                  id(temporary_profile_apply_pending) = false;
                  id(temporary_profile_lease_timer).stop();
                  ESP_LOGI("temp_profile", "Running native takeover detected during pending apply: %s",
                           flexit_modbus_server::mode_to_string(actual).c_str());
                  id(temporary_profile_clear_owner).execute(transaction);
                  return;
                }

                const int transaction = id(temporary_profile_pending_generation);
                id(temporary_profile_apply_pending) = false;
                id(temporary_profile_phase) = 2;
                id(temporary_profile_target_observed) = false;
                id(temporary_profile_change_ms) = millis();
                auto mode_call = id(set_mode).make_call();
                mode_call.set_option(target_mode);
                mode_call.perform();
                id(temporary_profile_lease_timer).execute(
                  transaction,
                  id(temporary_profile_lease_seconds)
                );
                id(temporary_profile_owner_sensor).update();
                id(temporary_profile_lease_remaining).update();

  - id: temporary_profile_lease_timer
    mode: restart
    parameters:
      transaction: int
      lease_seconds: int
    then:
      - delay: !lambda |-
          const int bounded_seconds = lease_seconds < 1
            ? 1 : (lease_seconds > ${MAX_SAFE_LEASE_SECONDS} ? ${MAX_SAFE_LEASE_SECONDS} : lease_seconds);
          return static_cast<uint32_t>(bounded_seconds) * 1000U;
      - lambda: |-
          if (transaction != id(temporary_profile_generation) ||
              !id(temporary_profile_active) ||
              id(temporary_profile_phase) != 2) {
            return;
          }

          const int expected = flexit_modbus_server::string_to_mode(
            id(temporary_profile_target_mode)
          );
          const int actual = id(server)->read_holding_register(
            flexit_modbus_server::REG_MODE
          );
          const bool original_mode_unacknowledged =
            !id(temporary_profile_target_observed) &&
            actual == id(temporary_profile_pre_apply_mode);
          const int cleanup_transaction =
            id(temporary_profile_generation) >= std::numeric_limits<int>::max()
              ? 1 : id(temporary_profile_generation) + 1;
          id(temporary_profile_generation) = cleanup_transaction;
          id(temporary_profile_phase) = 3;
          id(temporary_profile_apply_pending) = false;
          id(temporary_profile_apply).stop();

          if (actual == 0) {
            ESP_LOGI("temp_profile", "Lease expired in Stop; restoring snapshot without changing mode");
            id(temporary_profile_restore_snapshot).execute(cleanup_transaction);
            id(temporary_profile_clear_owner).execute(cleanup_transaction);
            return;
          }
          if (actual != expected && !original_mode_unacknowledged) {
            ESP_LOGI("temp_profile", "Running native takeover detected at lease expiry: %s",
                     flexit_modbus_server::mode_to_string(actual).c_str());
            id(temporary_profile_clear_owner).execute(cleanup_transaction);
            return;
          }

          ESP_LOGI("temp_profile", "Temporary profile lease expired");
          id(temporary_profile_finish).execute(cleanup_transaction);

  # Normal completion/release is transaction-bound. Before acknowledgement, the
  # captured pre-apply mode is still a normal completion state, not a takeover.
  - id: temporary_profile_finish
    mode: single
    parameters:
      transaction: int
    then:
      - lambda: |-
          if (transaction != id(temporary_profile_generation) ||
              !id(temporary_profile_active) ||
              id(temporary_profile_phase) != 3) {
            return;
          }

          const int actual = id(server)->read_holding_register(
            flexit_modbus_server::REG_MODE
          );
          if (actual == 0) {
            id(temporary_profile_restore_snapshot).execute(transaction);
            id(temporary_profile_clear_owner).execute(transaction);
            return;
          }

          const int expected = flexit_modbus_server::string_to_mode(
            id(temporary_profile_target_mode)
          );
          const bool original_mode_unacknowledged =
            !id(temporary_profile_target_observed) &&
            actual == id(temporary_profile_pre_apply_mode);
          if (actual != expected && !original_mode_unacknowledged) {
            ESP_LOGI("temp_profile", "Running native takeover detected during release: %s",
                     flexit_modbus_server::mode_to_string(actual).c_str());
            id(temporary_profile_clear_owner).execute(transaction);
            return;
          }

          if (actual != flexit_modbus_server::string_to_mode("Normal")) {
            id(temporary_profile_change_ms) = millis();
            auto mode_call = id(set_mode).make_call();
            mode_call.set_option("Normal");
            mode_call.perform();
          }
      - delay: ${temporary_profile_modbus_settle_delay}
      - lambda: |-
          if (transaction != id(temporary_profile_generation) ||
              !id(temporary_profile_active) ||
              id(temporary_profile_phase) != 3) {
            return;
          }

          const int actual = id(server)->read_holding_register(
            flexit_modbus_server::REG_MODE
          );
          if (actual == 0) {
            id(temporary_profile_restore_snapshot).execute(transaction);
            id(temporary_profile_clear_owner).execute(transaction);
            return;
          }
          const int expected_target = flexit_modbus_server::string_to_mode(
            id(temporary_profile_target_mode)
          );
          const bool original_mode_unacknowledged =
            !id(temporary_profile_target_observed) &&
            actual == id(temporary_profile_pre_apply_mode);
          const bool executor_mode_still_observed =
            actual == expected_target || original_mode_unacknowledged;
          if (actual != flexit_modbus_server::string_to_mode("Normal") &&
              !executor_mode_still_observed) {
            ESP_LOGI("temp_profile", "Running native takeover detected during cleanup: %s",
                     flexit_modbus_server::mode_to_string(actual).c_str());
            id(temporary_profile_clear_owner).execute(transaction);
            return;
          }

          id(temporary_profile_restore_snapshot).execute(transaction);
          id(temporary_profile_clear_owner).execute(transaction);

  - id: temporary_profile_restore_snapshot
    mode: single
    parameters:
      transaction: int
    then:
      - lambda: |-
          if (transaction != id(temporary_profile_generation) ||
              !id(temporary_profile_active) ||
              id(temporary_profile_phase) != 3) {
            return;
          }
          const auto &mode = id(temporary_profile_target_mode);
          const float supply = id(temporary_profile_restore_supply);
          const float extract = id(temporary_profile_restore_extract);

          if (mode == "Min") {
            auto a = id(supply_air_percentage_min).make_call(); a.set_value(supply); a.perform();
            auto b = id(extract_air_percentage_min).make_call(); b.set_value(extract); b.perform();
          } else if (mode == "Normal") {
            auto a = id(supply_air_percentage_normal).make_call(); a.set_value(supply); a.perform();
            auto b = id(extract_air_percentage_normal).make_call(); b.set_value(extract); b.perform();
          } else if (mode == "Max") {
            auto a = id(supply_air_percentage_max).make_call(); a.set_value(supply); a.perform();
            auto b = id(extract_air_percentage_max).make_call(); b.set_value(extract); b.perform();
          }

  - id: temporary_profile_clear_owner
    mode: single
    parameters:
      transaction: int
    then:
      - lambda: |-
          if (transaction != id(temporary_profile_generation) ||
              !id(temporary_profile_active) ||
              id(temporary_profile_phase) != 3) {
            return;
          }
          id(temporary_profile_active) = false;
          id(temporary_profile_owner).clear();
          id(temporary_profile_target_mode).clear();
          id(temporary_profile_supply) = 0.0f;
          id(temporary_profile_extract) = 0.0f;
          id(temporary_profile_lease_seconds) = 0;
          id(temporary_profile_lease_started_ms) = 0;
          id(temporary_profile_apply_pending) = false;
          id(temporary_profile_pending_generation) = 0;
          id(temporary_profile_target_observed) = false;
          id(temporary_profile_pre_apply_mode) = 0;
          id(temporary_profile_change_ms) = millis();
          id(temporary_profile_phase) = 0;
          id(temporary_profile_owner_sensor).update();
          id(temporary_profile_lease_remaining).update();

# Detect native Flexit/panel/I/O mode changes. Stop is checked before every
# acknowledgement guard. Running mismatch is bounded only until the target is
# first observed; after acknowledgement it is an immediate takeover.
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(temporary_profile_active)) return;

          const int actual = id(server)->read_holding_register(
            flexit_modbus_server::REG_MODE
          );

          // Stop invalidates pending apply or finish immediately and is never
          // hidden by the target-mode acknowledgement window.
          if (actual == 0) {
            const int transaction =
              id(temporary_profile_generation) >= std::numeric_limits<int>::max()
                ? 1 : id(temporary_profile_generation) + 1;
            id(temporary_profile_generation) = transaction;
            id(temporary_profile_phase) = 3;
            id(temporary_profile_apply_pending) = false;
            id(temporary_profile_apply).stop();
            id(temporary_profile_lease_timer).stop();
            id(temporary_profile_finish).stop();
            ESP_LOGI("temp_profile", "Stop detected; restoring snapshot without changing mode");
            id(temporary_profile_restore_snapshot).execute(transaction);
            id(temporary_profile_clear_owner).execute(transaction);
            return;
          }

          // A running mode before our delayed command is not yet comparable.
          // Finishing performs its own transaction-bound post-delay recheck.
          if (id(temporary_profile_phase) == 1 || id(temporary_profile_phase) == 3) return;
          if (id(temporary_profile_phase) != 2) return;

          const int expected = flexit_modbus_server::string_to_mode(
            id(temporary_profile_target_mode)
          );
          if (actual == expected) {
            if (!id(temporary_profile_target_observed)) {
              id(temporary_profile_target_observed) = true;
              ESP_LOGD("temp_profile", "Temporary target mode acknowledged");
            }
            return;
          }

          if (!id(temporary_profile_target_observed) &&
              (millis() - id(temporary_profile_change_ms)) < ${temporary_profile_mode_ack_timeout_ms}U) {
            return;
          }

          const int transaction =
            id(temporary_profile_generation) >= std::numeric_limits<int>::max()
              ? 1 : id(temporary_profile_generation) + 1;
          id(temporary_profile_generation) = transaction;
          id(temporary_profile_phase) = 3;
          id(temporary_profile_apply_pending) = false;
          id(temporary_profile_apply).stop();
          id(temporary_profile_lease_timer).stop();
          id(temporary_profile_finish).stop();
          ESP_LOGI("temp_profile", "Running native takeover detected: %s",
                   flexit_modbus_server::mode_to_string(actual).c_str());
          id(temporary_profile_clear_owner).execute(transaction);
