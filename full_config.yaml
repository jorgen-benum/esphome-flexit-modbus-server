          id(server)->send_cmd(
            flexit_modbus_server::REG_CMD_HEATER,
            0
          );

  - platform: template
    id: supply_air_control
    name: "Supply Air Control"
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
