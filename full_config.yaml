text_sensor:
  - platform: template
    id: temporary_profile_owner_sensor
    name: "Temporary Profile Owner"
    icon: mdi:account-key-outline
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      if (!id(temporary_profile_active) || id(temporary_profile_owner).empty()) {
        return std::string("none");
      }
      return id(temporary_profile_owner);

  - platform: template
    id: current_mode
    name: "Current Mode"
    update_interval: 1s
    lambda: |-
      return flexit_modbus_server::mode_to_string(
        id(server)->read_holding_register(
          flexit_modbus_server::REG_MODE
        )
      );

script:
  - id: temporary_profile_lease_timer
    mode: restart
    then:
      - delay: !lambda |-
          return static_cast<uint32_t>(id(temporary_profile_lease_seconds)) * 1000U;
      - if:
          condition:
            lambda: return id(temporary_profile_active);
          then:
            - logger.log:
                tag: temp_profile
                level: INFO
                format: "Temporary profile lease expired"
            - script.execute: temporary_profile_finish

  # Normal completion/release: return to Normal, restore the overridden profile,
  # then clear ownership. Stop is never left automatically.
  - id: temporary_profile_finish
    mode: single
    then:
      - script.stop: temporary_profile_lease_timer
      - if:
          condition:
            lambda: |-
              return id(temporary_profile_active) &&
                     id(server)->read_holding_register(flexit_modbus_server::REG_MODE) == 0;
          then:
            # Stop is protected even if an explicit release races the 1 s watcher.
            - script.execute: temporary_profile_restore_snapshot
            - script.execute: temporary_profile_clear_owner
          else:
            - lambda: |-
                if (!id(temporary_profile_active)) return;
                id(temporary_profile_change_ms) = millis();
                auto mode_call = id(set_mode).make_call();
                mode_call.set_option("Normal");
                mode_call.perform();
            - delay: 200ms
            - script.execute: temporary_profile_restore_snapshot
            - script.execute: temporary_profile_clear_owner

  - id: temporary_profile_restore_snapshot
    mode: single
    then:
      - lambda: |-
          if (!id(temporary_profile_active)) return;
          const auto &mode = id(temporary_profile_target_mode);
          const float supply = id(temporary_profile_restore_supply);
          const float extract = id(temporary_profile_restore_extract);

          if (mode == "Min") {
            auto a = id(supply_air_percentage_min).make_call(); a.set_value(supply); a.perform();
            auto b = id(extract_air_percentage_min).make_call(); b.set_value(extract); b.perform();
          } else if (mode == "Normal") {
            auto a = id(supply_air_percentage_normal).make_call(); a.set_value(supply); a.perform();
            auto b = id(extract_air_percentage_normal).make_call(); b.set_value(extract); b.perform();
          } else if (mode == "Max") {
            auto a = id(supply_air_percentage_max).make_call(); a.set_value(supply); a.perform();
            auto b = id(extract_air_percentage_max).make_call(); b.set_value(extract); b.perform();
          }

  - id: temporary_profile_clear_owner
    mode: single
    then:
      - lambda: |-
          id(temporary_profile_active) = false;
          id(temporary_profile_owner).clear();
          id(temporary_profile_target_mode).clear();
          id(temporary_profile_lease_seconds) = 0;
          id(temporary_profile_lease_started_ms) = 0;
          id(temporary_profile_change_ms) = millis();
          id(temporary_profile_owner_sensor).update();
          id(temporary_profile_lease_remaining).update();

# Detect native Flexit/panel/I/O mode changes. A running external mode cancels
# ownership without restoration; Stop additionally restores the temporary slot
# while leaving the unit stopped.
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(temporary_profile_active)) return false;
              if ((millis() - id(temporary_profile_change_ms)) < 5000U) return false;
              const int expected = flexit_modbus_server::string_to_mode(id(temporary_profile_target_mode));
              const int actual = id(server)->read_holding_register(flexit_modbus_server::REG_MODE);
              return actual != expected;
          then:
            - lambda: |-
                const int actual = id(server)->read_holding_register(flexit_modbus_server::REG_MODE);
                ESP_LOGI("temp_profile", "External mode change detected: %s",
                         flexit_modbus_server::mode_to_string(actual).c_str());
            - script.stop: temporary_profile_lease_timer
            - if:
                condition:
                  lambda: |-
                    return id(server)->read_holding_register(flexit_modbus_server::REG_MODE) == 0;
                then:
                  # Stop is a protected state: clean the overridden slot but
                  # never command a mode change away from Stop.
                  - script.execute: temporary_profile_restore_snapshot
            - script.execute: temporary_profile_clear_owner
